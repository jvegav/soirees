<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Lyon Nightlife data platform architecture</title>
  <desc id="desc">Architecture diagram showing external data sources, Airflow ETL, PostGIS warehouse, FastAPI, Angular and Google Places cache.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <linearGradient id="purple" x1="0" x2="1"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
    <linearGradient id="green" x1="0" x2="1"><stop stop-color="#059669"/><stop offset="1" stop-color="#34d399"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 z" fill="#94a3b8"/></marker>
    <style>text{font-family:Inter,Arial,sans-serif;fill:#e2e8f0} .small{font-size:16px;fill:#cbd5e1} .label{font-size:19px;font-weight:700} .box{stroke:#64748b;stroke-width:1.5} .arrow{stroke:#94a3b8;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="620" rx="24" fill="url(#bg)"/>
  <text x="60" y="58" font-size="30" font-weight="800">Lyon Nightlife Data Platform</text>
  <text x="60" y="88" class="small">Batch ingestion → spatial warehouse → recommendation API → interactive dashboard</text>
  <rect x="55" y="145" width="230" height="330" rx="18" fill="#111827" class="box" filter="url(#shadow)"/>
  <text x="82" y="185" class="label">Data sources</text>
  <rect x="80" y="215" width="180" height="55" rx="12" fill="url(#blue)"/><text x="170" y="249" text-anchor="middle" font-size="17" font-weight="700">OpenStreetMap</text><text x="170" y="268" text-anchor="middle" class="small" font-size="13">Overpass API</text>
  <rect x="80" y="290" width="180" height="55" rx="12" fill="#334155"/><text x="170" y="324" text-anchor="middle" font-size="17" font-weight="700">DATAtourisme</text><text x="170" y="343" text-anchor="middle" class="small" font-size="13">optional enrichment</text>
  <rect x="80" y="365" width="180" height="55" rx="12" fill="#334155"/><text x="170" y="399" text-anchor="middle" font-size="17" font-weight="700">Google Places</text><text x="170" y="418" text-anchor="middle" class="small" font-size="13">daily controlled refresh</text>
  <rect x="350" y="145" width="250" height="330" rx="18" fill="#111827" class="box" filter="url(#shadow)"/>
  <text x="377" y="185" class="label">Orchestration</text>
  <rect x="378" y="220" width="194" height="70" rx="14" fill="url(#purple)"/><text x="475" y="253" text-anchor="middle" font-size="18" font-weight="800">Apache Airflow</text><text x="475" y="275" text-anchor="middle" class="small" font-size="14">lyon_nightlife_etl</text>
  <text x="378" y="335" class="small">1. Extract raw data</text><text x="378" y="365" class="small">2. Normalize &amp; load</text><text x="378" y="395" class="small">3. Deduplicate places</text><text x="378" y="425" class="small">4. Calculate candidates</text>
  <rect x="665" y="145" width="235" height="330" rx="18" fill="#111827" class="box" filter="url(#shadow)"/>
  <text x="692" y="185" class="label">Storage &amp; analytics</text>
  <rect x="690" y="220" width="185" height="74" rx="14" fill="url(#green)"/><text x="782" y="253" text-anchor="middle" font-size="18" font-weight="800">PostgreSQL</text><text x="782" y="276" text-anchor="middle" font-size="15">+ PostGIS</text>
  <text x="692" y="335" class="small">raw.venues</text><text x="692" y="365" class="small">core.places</text><text x="692" y="395" class="small">analytics.routes</text><text x="692" y="425" class="small">Google Places cache</text>
  <rect x="965" y="145" width="180" height="330" rx="18" fill="#111827" class="box" filter="url(#shadow)"/>
  <text x="992" y="185" class="label">Serving</text>
  <rect x="990" y="220" width="130" height="70" rx="14" fill="#f97316"/><text x="1055" y="253" text-anchor="middle" font-size="18" font-weight="800">FastAPI</text><text x="1055" y="275" text-anchor="middle" font-size="14">REST API</text>
  <rect x="990" y="325" width="130" height="70" rx="14" fill="#dc2777"/><text x="1055" y="358" text-anchor="middle" font-size="18" font-weight="800">Angular</text><text x="1055" y="380" text-anchor="middle" font-size="14">Leaflet dashboard</text>
  <path d="M285 310 H350" class="arrow"/><path d="M600 310 H665" class="arrow"/><path d="M900 310 H965" class="arrow"/><path d="M1055 290 V325" class="arrow"/>
  <text x="60" y="555" class="small">Docker Compose provides a reproducible local environment for Airflow, PostGIS, API and dashboard.</text>
</svg>
