<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
  <title id="title">Lyon Nightlife warehouse data model</title>
  <desc id="desc">Entity relationship diagram for raw venues, core places, routes and Google Places cache.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 z" fill="#94a3b8"/></marker><style>text{font-family:Inter,Arial,sans-serif;fill:#f8fafc}.head{font-size:21px;font-weight:800}.field{font-size:15px;fill:#dbeafe}.line{stroke:#94a3b8;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="570" rx="24" fill="url(#bg)"/><text x="55" y="52" font-size="29" font-weight="800">PostgreSQL + PostGIS data model</text><text x="55" y="80" class="field">Raw provenance is preserved while core entities and derived analytics remain queryable.</text>
  <rect x="55" y="145" width="260" height="280" rx="16" fill="#0f766e" stroke="#5eead4" stroke-width="2"/><text x="80" y="185" class="head">raw.venues</text><text x="80" y="220" class="field">raw_id · BIGSERIAL</text><text x="80" y="247" class="field">source · source_id</text><text x="80" y="274" class="field">name · category</text><text x="80" y="301" class="field">address · postcode</text><text x="80" y="328" class="field">opening_hours</text><text x="80" y="355" class="field">latitude · longitude</text><text x="80" y="382" class="field">tags · JSONB</text><text x="80" y="409" class="field">extracted_at</text>
  <rect x="470" y="125" width="280" height="330" rx="16" fill="#1d4ed8" stroke="#93c5fd" stroke-width="2"/><text x="495" y="165" class="head">core.places</text><text x="495" y="200" class="field">place_id · BIGSERIAL</text><text x="495" y="227" class="field">canonical_name · category</text><text x="495" y="254" class="field">address · city · website</text><text x="495" y="281" class="field">opening_hours</text><text x="495" y="308" class="field">source_count · quality_score</text><text x="495" y="335" class="field">latitude · longitude</text><text x="495" y="362" class="field">geom · geometry(Point,4326)</text><text x="495" y="389" class="field">loaded_at</text><text x="495" y="430" class="field">Canonical spatial entity</text>
  <rect x="895" y="115" width="250" height="180" rx="16" fill="#9333ea" stroke="#d8b4fe" stroke-width="2"/><text x="920" y="155" class="head">analytics.routes</text><text x="920" y="190" class="field">route_id</text><text x="920" y="217" class="field">club_id → places</text><text x="920" y="244" class="field">restaurant_id → places</text><text x="920" y="271" class="field">distance · duration</text>
  <rect x="895" y="350" width="250" height="150" rx="16" fill="#c2410c" stroke="#fdba74" stroke-width="2"/><text x="920" y="390" class="head">Google cache</text><text x="920" y="425" class="field">google_daily_requests</text><text x="920" y="452" class="field">google_places</text><text x="920" y="479" class="field">one request / day</text>
  <path d="M315 285 C370 285 400 285 470 285" class="line"/><text x="350" y="260" class="field">normalize + deduplicate</text><path d="M750 220 C805 205 835 195 895 195" class="line"/><text x="780" y="175" class="field">derived</text><path d="M750 385 C810 420 835 425 895 425" class="line"/><text x="785" y="455" class="field">enrichment match</text>
</svg>
