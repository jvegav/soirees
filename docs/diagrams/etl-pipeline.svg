<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Lyon Nightlife ETL pipeline</title>
  <desc id="desc">Airflow pipeline from extraction to spatial recommendation analytics.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#312e81"/></linearGradient><linearGradient id="card" x1="0" x2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#7c3aed"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 z" fill="#cbd5e1"/></marker><style>text{font-family:Inter,Arial,sans-serif;fill:#f8fafc}.sub{font-size:15px;fill:#dbeafe}.arrow{stroke:#cbd5e1;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="430" rx="24" fill="url(#bg)"/><text x="55" y="55" font-size="29" font-weight="800">Airflow DAG · lyon_nightlife_etl</text><text x="55" y="83" class="sub">Idempotent raw loading followed by canonicalization and spatial analytics</text>
  <g transform="translate(50 145)">
    <rect width="185" height="145" rx="18" fill="url(#card)"/><text x="92" y="43" text-anchor="middle" font-size="20" font-weight="800">Extract</text><text x="92" y="75" text-anchor="middle" class="sub">OSM / Overpass</text><text x="92" y="99" text-anchor="middle" class="sub">DATAtourisme*</text><text x="92" y="123" text-anchor="middle" class="sub">SIRENE*</text><path d="M185 72 H235" class="arrow"/>
    <rect x="235" width="185" height="145" rx="18" fill="#0ea5e9"/><text x="327" y="43" text-anchor="middle" font-size="20" font-weight="800">Normalize</text><text x="327" y="78" text-anchor="middle" class="sub">schema mapping</text><text x="327" y="102" text-anchor="middle" class="sub">category + hours</text><text x="327" y="126" text-anchor="middle" class="sub">coordinates</text><path d="M420 72 H470" class="arrow"/>
    <rect x="470" width="185" height="145" rx="18" fill="#14b8a6"/><text x="562" y="43" text-anchor="middle" font-size="20" font-weight="800">Load raw</text><text x="562" y="78" text-anchor="middle" class="sub">raw.venues</text><text x="562" y="102" text-anchor="middle" class="sub">upsert by source</text><text x="562" y="126" text-anchor="middle" class="sub">JSONB provenance</text><path d="M655 72 H705" class="arrow"/>
    <rect x="705" width="185" height="145" rx="18" fill="#f59e0b"/><text x="797" y="43" text-anchor="middle" font-size="20" font-weight="800">Transform</text><text x="797" y="78" text-anchor="middle" class="sub">deduplicate</text><text x="797" y="102" text-anchor="middle" class="sub">quality score</text><text x="797" y="126" text-anchor="middle" class="sub">core.places</text><path d="M890 72 H940" class="arrow"/>
    <rect x="940" width="185" height="145" rx="18" fill="#ec4899"/><text x="1032" y="43" text-anchor="middle" font-size="20" font-weight="800">Spatial analytics</text><text x="1032" y="78" text-anchor="middle" class="sub">PostGIS distance</text><text x="1032" y="102" text-anchor="middle" class="sub">walking estimate</text><text x="1032" y="126" text-anchor="middle" class="sub">analytics.routes</text>
  </g><text x="55" y="365" class="sub">* Optional sources are activated through environment variables. Failed optional extraction should not be confused with missing core OSM data.</text>
</svg>
