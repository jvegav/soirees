services:
  warehouse:
    image: postgis/postgis:16-3.4
    container_name: lyon-nightlife-warehouse
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lyon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lyon}
      POSTGRES_DB: ${POSTGRES_DB:-lyon_nightlife}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./sql/airflow-db.sql:/docker-entrypoint-initdb.d/02-airflow-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lyon} -d ${POSTGRES_DB:-lyon_nightlife}"]
      interval: 10s
      timeout: 5s
      retries: 10

  airflow-init:
    image: apache/airflow:2.10.5-python3.12
    depends_on:
      warehouse:
        condition: service_healthy
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://lyon:lyon@warehouse:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      AIRFLOW__WEBSERVER__SECRET_KEY: local-development-key
      AIRFLOW_CONN_LYON_WAREHOUSE: postgresql://lyon:lyon@warehouse:5432/lyon_nightlife
      OVERPASS_URL: ${OVERPASS_URL:-https://overpass-api.de/api/interpreter}
      DATATOURISME_URL: ${DATATOURISME_URL:-}
      DATATOURISME_API_KEY: ${DATATOURISME_API_KEY:-}
      SIRENE_URL: ${SIRENE_URL:-}
      LYON_BBOX: ${LYON_BBOX:-45.68,4.75,45.85,4.95}
      _PIP_ADDITIONAL_REQUIREMENTS: "pandas==2.2.3 requests==2.32.3 SQLAlchemy==1.4.54 psycopg2-binary==2.9.10 GeoAlchemy2==0.15.2 Shapely==2.0.6 python-dotenv==1.0.1"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - ./data:/opt/airflow/data
    command: bash -c "airflow db migrate && airflow users create --username airflow --password airflow --firstname Local --lastname User --role Admin --email airflow@example.com || true"

  airflow-webserver:
    image: apache/airflow:2.10.5-python3.12
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - ./data:/opt/airflow/data
    command: webserver

  airflow-scheduler:
    image: apache/airflow:2.10.5-python3.12
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - ./data:/opt/airflow/data
    command: scheduler

  api:
    build: ./backend
    container_name: lyon-nightlife-api
    depends_on:
      warehouse:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://lyon:lyon@warehouse:5432/lyon_nightlife
    ports:
      - "8000:8000"

  dashboard:
    build: ./frontend
    container_name: lyon-nightlife-dashboard
    depends_on:
      - api
    ports:
      - "4200:80"

volumes:
  postgres_data:
